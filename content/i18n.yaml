  pt: Se um dia o cask do Homebrew tiver auto_updates, o Sparkle atualiza o app em Aplicativos. O brew upgrade normal não substitui esse app.
  en: If a Homebrew cask is later published with auto_updates, Sparkle updates the app in Applications. A normal brew upgrade will not replace that app.
