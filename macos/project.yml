name: Breve
options:
  bundleIdPrefix: dev.fordevs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  preGenCommand: |
    mkdir -p Resources
    cp ../content/catalog.yaml ../content/development.pt.yaml ../content/development.en.yaml ../content/i18n.yaml Resources/
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 6.2.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Breve:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/catalog.yaml
        buildPhase: resources
      - path: Resources/development.pt.yaml
        buildPhase: resources
      - path: Resources/development.en.yaml
        buildPhase: resources
      - path: Resources/i18n.yaml
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: https://raw.githubusercontent.com/xinnaider/breve/main/updates/appcast.xml
        SUPublicEDKey: 8JpyN20Zo6bJdO5rYRLzo5apS7FQbUR4qrihkt1HQ+E=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
    entitlements:
      path: Breve.entitlements
    preBuildScripts:
      - name: Sync YAML from content
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "${PROJECT_DIR}/Resources"
          cp "${PROJECT_DIR}/../content/catalog.yaml" "${PROJECT_DIR}/Resources/catalog.yaml"
          cp "${PROJECT_DIR}/../content/development.pt.yaml" "${PROJECT_DIR}/Resources/development.pt.yaml"
          cp "${PROJECT_DIR}/../content/development.en.yaml" "${PROJECT_DIR}/Resources/development.en.yaml"
          cp "${PROJECT_DIR}/../content/i18n.yaml" "${PROJECT_DIR}/Resources/i18n.yaml"
    dependencies:
      - package: Yams
        product: Yams
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fordevs.breve
        PRODUCT_NAME: Breve
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
        DEAD_CODE_STRIPPING: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -file-prefix-map $(SRCROOT)=/breve -file-prefix-map $(HOME)=/home -debug-prefix-map $(SRCROOT)=/breve -debug-prefix-map $(HOME)=/home"
        OTHER_CFLAGS: "$(inherited) -ffile-prefix-map=$(SRCROOT)=/breve -ffile-prefix-map=$(HOME)=/home -fdebug-prefix-map=$(SRCROOT)=/breve -fdebug-prefix-map=$(HOME)=/home"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        debug:
          ENABLE_LIBRARY_VALIDATION: NO
        release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_SWIFT_SYMBOLS: YES
          COPY_PHASE_STRIP: YES
          SWIFT_SERIALIZE_DEBUGGING_OPTIONS: NO
